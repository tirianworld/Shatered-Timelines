<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c0803" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CDD Gacha 2" />
    <meta name="application-name" content="CDD Gacha 2" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Remix Remix CDD Gacha v2.3.1.3</title>
    <meta name="description" content="Juego RPG Gacha con invocaciones, patrullas, combate táctico por turnos, forja, taberna y gestión de héroes." />
    <meta property="og:title" content="Remix Remix CDD Gacha v2.3.1.3" />
    <meta property="og:description" content="Juego RPG Gacha con invocaciones, patrullas, combate táctico por turnos, forja, taberna y gestión de héroes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #0c0a09;
        color: #f5f5f4;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      @keyframes pulseSlow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .preloader-glow {
        animation: pulseSlow 2s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="bg-stone-950 text-stone-100">
    <div id="root">
      <div id="cdd-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0c0a09; color: #d97706; text-align: center; padding: 20px;">
        <div class="preloader-glow" style="width: 56px; height: 56px; border-radius: 12px; background: linear-gradient(135deg, #d97706, #7f1d1d, #000); border: 2px solid #b45309; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-weight: 900; font-size: 24px; color: #fef3c7; font-family: serif;">
          CDD
        </div>
        <div style="font-family: serif; font-size: 22px; font-weight: bold; letter-spacing: 2px; color: #fde68a; margin-bottom: 6px;">
          CDD GACHA 2
        </div>
        <div style="font-size: 13px; color: #a8a29e; font-family: monospace; margin-bottom: 12px;">
          Despertando el Bastión de Icespear...
        </div>
        <div id="cdd-preloader-fallback" style="display: none; margin-top: 10px;">
          <button onclick="try{localStorage.clear();}catch(e){}window.location.reload();" style="padding: 8px 16px; background: #b45309; color: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer;">
            ¿Tarda en cargar? Limpiar datos y reiniciar
          </button>
        </div>
      </div>
    </div>
    <script>
      // Show fallback button if preloader doesn't disappear in 3.5s
      setTimeout(function() {
        var fallback = document.getElementById('cdd-preloader-fallback');
        if (fallback) fallback.style.display = 'block';
      }, 3500);

      window.addEventListener('error', function(e) {
        var preloader = document.getElementById('cdd-preloader');
        if (preloader) {
          var fallback = document.getElementById('cdd-preloader-fallback');
          if (fallback) fallback.style.display = 'block';
        }
      });
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) {
            if (name !== 'cdd-gacha-v2') caches.delete(name);
          });
        });
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              if (reg && typeof reg.update === 'function') {
                reg.update().catch(function() {});
              }
            })
            .catch(function(err) {
              console.warn('SW registration skipped:', err);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
