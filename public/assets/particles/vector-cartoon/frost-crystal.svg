<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="iceFacet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="iceFacet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="iceFacetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <!-- Outer bold cartoon diamond -->
  <polygon points="64,8 108,64 64,120 20,64"
           fill="#075985"
           stroke="#082f49"
           stroke-width="6"
           stroke-linejoin="round"/>
  <!-- Top Left Bright Facet -->
  <polygon points="64,14 64,64 24,64"
           fill="url(#iceFacet1)"/>
  <!-- Top Right Mid Facet -->
  <polygon points="64,14 104,64 64,64"
           fill="#7dd3fc"/>
  <!-- Bottom Left Dark Facet -->
  <polygon points="24,64 64,64 64,114"
           fill="url(#iceFacetDark)"/>
  <!-- Bottom Right Vibrant Facet -->
  <polygon points="104,64 64,114 64,64"
           fill="url(#iceFacet2)"/>
  <!-- Central Ice Core Specular Glint -->
  <polygon points="64,42 74,64 64,86 54,64"
           fill="#ffffff"
           opacity="0.95"/>
  <!-- Specular glint streak -->
  <line x1="64" y1="20" x2="64" y2="108" stroke="#ffffff" stroke-width="2.5" opacity="0.75" stroke-linecap="round"/>
</svg>
