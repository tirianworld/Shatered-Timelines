  <line x1="64" y1="96" x2="64" y2="108" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round"/>
  <line x1="72" y1="96" x2="72" y2="108" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round"/>
