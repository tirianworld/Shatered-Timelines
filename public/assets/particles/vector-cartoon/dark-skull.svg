  <!-- Smoke Skull Silhouette -->
  <path d="M64 12 C34 12 24 38 24 62 C24 78 34 88 42 92 C42 102 46 112 52 114 C56 116 72 116 76 114 C82 112 86 102 86 92 C94 88 104 78 104 62 C104 38 94 12 64 12 Z"
