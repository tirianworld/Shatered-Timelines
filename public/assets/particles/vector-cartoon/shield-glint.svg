<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Hexagon Barrier Shard with Dark Outline -->
  <polygon points="64,8 108,34 108,94 64,120 20,94 20,34"
           fill="url(#shieldGrad)"
           stroke="#082f49"
           stroke-width="6"
           stroke-linejoin="round"/>
  <!-- Inner Golden/Cyan Rim -->
  <polygon points="64,18 98,38 98,90 64,110 30,90 30,38"
           fill="none"
           stroke="#facc15"
           stroke-width="3"
           opacity="0.85"/>
  <!-- Bright Gloss Reflection Angle -->
  <polygon points="64,22 92,40 64,74 36,40"
           fill="#ffffff"
           opacity="0.55"/>
  <circle cx="64" cy="64" r="7" fill="#ffffff" opacity="0.9"/>
</svg>
