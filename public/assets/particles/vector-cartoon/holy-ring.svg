<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <!-- Outer Halo Ring -->
  <circle cx="64" cy="64" r="48"
          fill="none"
          stroke="#78350f"
          stroke-width="12"/>
  <circle cx="64" cy="64" r="48"
          fill="none"
          stroke="url(#ringGrad)"
          stroke-width="7"/>
  <circle cx="64" cy="64" r="48"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.5"
          opacity="0.85"/>
  <!-- 4 Diamond Glints on the Ring -->
  <polygon points="64,8 69,16 64,24 59,16" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
  <polygon points="64,104 69,112 64,120 59,112" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
  <polygon points="8,64 16,59 24,64 16,69" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
  <polygon points="104,64 112,59 120,64 112,69" fill="#ffffff" stroke="#78350f" stroke-width="2"/>
</svg>
