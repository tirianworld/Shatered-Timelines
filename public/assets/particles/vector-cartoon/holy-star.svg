  </defs>
  <!-- 8-Point Cartoon Star with Thick Outline -->
  <polygon points="64,6 74,46 114,36 84,64 122,64 84,74 114,102 74,92 64,122 54,92 14,102 44,74 6,64 44,64 14,36 54,46"
