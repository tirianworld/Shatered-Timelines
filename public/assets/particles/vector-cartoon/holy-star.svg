  <circle cx="64" cy="64" r="10" fill="#ffffff"/>
  <!-- Radiant Corner Glints -->
  <circle cx="28" cy="28" r="3.5" fill="#fef08a" stroke="#78350f" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="3.5" fill="#fef08a" stroke="#78350f" stroke-width="1.5"/>
