<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Outer Cartoon Flame Body -->
  <path d="M64 8 C72 32 94 48 94 76 C94 98 79 116 62 116 C45 116 32 98 32 76 C32 54 48 38 52 24 C56 34 60 40 56 52 C62 42 64 22 64 8 Z"
        fill="url(#flameGrad)"
        stroke="#450a0a"
        stroke-width="5"
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#flameGlow)"/>
  <!-- Cel-Shade Mid Tone -->
  <path d="M64 30 C70 48 84 62 84 80 C84 96 74 108 63 108 C52 108 42 96 42 80 C42 66 52 54 55 42 C58 50 60 56 58 64 C62 56 64 42 64 30 Z"
        fill="#fbbf24"
        opacity="0.9"/>
  <!-- Hot Inner Core -->
  <path d="M64 50 C68 64 74 74 74 86 C74 96 68 102 63 102 C58 102 52 96 52 86 C52 76 58 66 60 58 C62 64 63 68 62 72 C64 68 64 58 64 50 Z"
        fill="url(#coreGrad)"/>
  <!-- Detached Cartoon Ember Spark -->
  <ellipse cx="64" cy="5" rx="3.5" ry="5" fill="#fef08a" stroke="#450a0a" stroke-width="2"/>
</svg>
