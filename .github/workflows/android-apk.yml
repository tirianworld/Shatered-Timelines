name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main-nuevo
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/android @capacitor/cli

      - name: Build web app for Android
        env:
          VITE_API_BASE_URL: https://cdd-gacha-backend-jwt1.onrender.com
        run: npm run build

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CDD-Gacha-2-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
