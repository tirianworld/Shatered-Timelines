services:
  - type: web
    name: cdd-gacha-backend
    runtime: node
    plan: free
    region: frankfurt
    branch: main-nuevo
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: GITHUB_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://localhost,capacitor://localhost"
